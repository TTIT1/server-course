
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:true}

  ai:
   google:
    genai:
      api-key: ${GEMINI_API_KEY}
      chat:
        options:
          model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
      embedding:
        api-key: ${GEMINI_API_KEY}
        text:
          options:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  vectorstore:
   qdrant:
    host: ${QDRANT_HOST:localhost}
    port: ${QDRANT_PORT:6334}
    api-key: ${QDRANT_API_KEY}
    collection-name: ${QDRANT_COLLECTION:documents}
    initialize-schema: true
    use-tls: ${QDRANT_TLS:true}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc.time_zone: UTC

server:
  port: ${PORT:8080}

jwt:
  select_key: ${JWT_SELECT_KEY}

gmail:
  gmail_key: ${GMAIL_USERNAME}
  gmail_app_password: ${GMAIL_APP_PASSWORD}

api:
  public_endpoints: ${PUBLIC_ENDPOINTS}

cloudinary:
  cloud-name: ${CLOUDINARY_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  secure: true

payment:
  vnPay:
    url: ${VNPAY_URL}
    returnUrl: ${VNPAY_RETURN_URL}
    tmnCode: ${VNPAY_TMN_CODE}
    secretKey: ${VNPAY_SECRET_KEY}
    version: ${VNPAY_VERSION}
    command: ${VNPAY_COMMAND}
    orderType: ${VNPAY_ORDER_TYPE}
